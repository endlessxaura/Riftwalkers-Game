name: Build Game

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

    - name: Run Tests
      run: dotnet test

    - name: Create Executable
      run: |
        mkdir -p build
        godot --headless --path . --export-release "Windows Desktop" build/Riftwalkers.exe
        interval=1000
        intervals=60
        while [ ! -f build/Riftwalkers.exe ] && [ $intervals -gt 0 ]; 
        do 
            $intervals--; 
            sleep 1000; 
        done
      shell: bash

    - name: Upload as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Riftwalkers
        path: build/
        if-no-files-found: error
