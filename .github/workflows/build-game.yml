name: Build Game

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v2
      with:
          version: 4.7.2
          use-dotnet: true
          include-templates: false

    - name: Generate .NET Glue
      run: godot --headless --generate-mono-glue modules/mono/glue

    - name: Build Godot Managed Libraries
      run: ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin

    - name: Build Projects
      run: dotnet build --configuration Release

    - name: Create Executable
      run: godot --headless --path . --export-release Riftwalkers.exe

    - name: Upload as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Riftwalkers
        path: ./Riftwalkers.exe
